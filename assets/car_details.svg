<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 92">
  <!-- 90s arcade car details (untinted). Nose points up. -->

  <!-- Windshield -->
  <rect x="13" y="8" width="18" height="12"
        fill="#3a5878" stroke="#101018" stroke-width="1.2"/>

  <!-- Rear window -->
  <rect x="14" y="64" width="16" height="10"
        fill="#3a5878" stroke="#101018" stroke-width="1"/>

  <!-- Roof -->
  <rect x="15" y="22" width="14" height="38" fill="#282830" opacity="0.35"/>

  <!-- Headlights -->
  <rect x="11" y="4" width="5" height="4" fill="#fff8d0" stroke="#101018" stroke-width="0.8"/>
  <rect x="28" y="4" width="5" height="4" fill="#fff8d0" stroke="#101018" stroke-width="0.8"/>

  <!-- Taillights -->
  <rect x="11" y="84" width="5" height="4" fill="#e83030" stroke="#101018" stroke-width="0.8"/>
  <rect x="28" y="84" width="5" height="4" fill="#e83030" stroke="#101018" stroke-width="0.8"/>

  <!-- Front-left wheel -->
  <rect x="7" y="24" width="6" height="5" rx="1" fill="#1a1a22" stroke="#101018" stroke-width="1"/>
  <rect x="8.5" y="25.2" width="3" height="2.5" fill="#686870"/>

  <!-- Front-right wheel -->
  <rect x="31" y="24" width="6" height="5" rx="1" fill="#1a1a22" stroke="#101018" stroke-width="1"/>
  <rect x="32.5" y="25.2" width="3" height="2.5" fill="#686870"/>

  <!-- Rear-left wheel -->
  <rect x="7" y="62" width="6" height="5" rx="1" fill="#1a1a22" stroke="#101018" stroke-width="1"/>
  <rect x="8.5" y="63.2" width="3" height="2.5" fill="#686870"/>

  <!-- Rear-right wheel -->
  <rect x="31" y="62" width="6" height="5" rx="1" fill="#1a1a22" stroke="#101018" stroke-width="1"/>
  <rect x="32.5" y="63.2" width="3" height="2.5" fill="#686870"/>
</svg>
