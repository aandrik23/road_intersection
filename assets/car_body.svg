<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 92">
  <!-- 90s arcade top-down car (tinted). Nose points up. Blocky rects, thick outline. -->
  <rect x="10" y="4" width="24" height="84" rx="2" ry="2"
        fill="#c0c0c8" stroke="#101018" stroke-width="2"/>

  <!-- Hood -->
  <rect x="12" y="6" width="20" height="18"
        fill="#d8d8e0" stroke="#101018" stroke-width="1"/>

  <!-- Cabin sides -->
  <rect x="11" y="26" width="22" height="34"
        fill="#b8b8c0" stroke="#101018" stroke-width="1"/>

  <!-- Trunk / rear deck -->
  <rect x="12" y="62" width="20" height="22"
        fill="#d0d0d8" stroke="#101018" stroke-width="1"/>

  <!-- Door lines -->
  <rect x="11" y="42" width="22" height="2" fill="#888890" opacity="0.55"/>
  <rect x="21" y="26" width="2" height="34" fill="#888890" opacity="0.4"/>

  <!-- Side mirrors -->
  <rect x="7" y="34" width="3" height="4" fill="#a8a8b0" stroke="#101018" stroke-width="0.8"/>
  <rect x="34" y="34" width="3" height="4" fill="#a8a8b0" stroke="#101018" stroke-width="0.8"/>
</svg>
